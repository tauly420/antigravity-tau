<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tau-ly-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tau-LY Lab Tools — Computational suite for laboratory data analysis, simulations, and utilities." />
    <title>Tau-LY Lab Tools</title>
    <script>
      // Apply saved theme before paint to avoid flash. Defaults to light.
      (function () {
        try {
          var t = localStorage.getItem('tauly-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
